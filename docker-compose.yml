networks:
  cortex-net:
    driver: bridge

services:

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    ports:
      - "8000:8000"
    platform: linux/amd64
    environment:
      - PATHWAY_URL=http://pathway_engine:8080/
    depends_on:
      - pathway_engine
    networks:
      - cortex-net
    volumes:
      - ./services/gateway:/app/services/gateway
      - ./shared:/app/shared

  pathway_engine:
    build:
      context: .
      dockerfile: services/pathway_engine/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./services/pathway_engine:/app/services/pathway_engine
      - ./shared:/app/shared
      - ./data:/app/data
    networks:
      - cortex-net




  watchdog:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: cortex_watchdog
    command: ["python", "watchdog_runner.py"]
    env_file:
      - .env
    depends_on:
      - pathway_engine
    volumes:
      - ./services/orchestrator:/app/services/orchestrator
      - ./shared:/app/shared
      - ./data:/app/data
    networks:
      - cortex-net

  agent_worker:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    container_name: cortex_agent_worker
    command: ["python", "agent_worker.py"]
    env_file:
      - .env
    depends_on:
      - gateway
      - pathway_engine
    volumes:
      - ./services/orchestrator:/app/services/orchestrator
      - ./shared:/app/shared
      - ./data:/app/data
    networks:
      - cortex-net

  frontend:
    build:
      context: ./frontend # Path to your frontend folder
      dockerfile: Dockerfile
    container_name: cortex_frontend
    ports:
      - "3000:3000"
    environment:
      # Tell the frontend to talk to the Nginx proxy or gateway
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/telemetry
    restart: unless-stopped
    networks:
      - cortex-net
    depends_on:
      - gateway # Ensure backend starts first

  # 2. The Reverse Proxy (Optional but highly recommended for "Very Good" projects)
  nginx:
    image: nginx:alpine
    container_name: cortex_proxy
    ports:
      - "80:80" # Maps localhost:80 to the proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # Mount your routing config
    networks:
      - cortex-net
    depends_on:
      - frontend
      - gateway
      - pathway_engine
